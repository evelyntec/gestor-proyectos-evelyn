{% extends "base.html" %}
{% block titulo %}Eliminar tarea{% endblock %}
{% block contenido %}
<section class="panel panel-formulario panel-peligro">
  <h1>¿Eliminar «{{ tarea.titulo }}»?</h1>
  <p>La tarea se quitará del proyecto «{{ proyecto.nombre }}». Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <div class="grupo-botones">
      <button type="submit" class="boton boton-peligro">Eliminar tarea</button>
      <a href="{{ proyecto.get_absolute_url }}" class="boton boton-suave">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
